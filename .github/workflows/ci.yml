name: CI

on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies & Build
      run: |
        cd frontend
        npm install
        npm run build

    - name: Install Backend Dependencies & Build
      run: |
        cd backend
        npm install
        npm run build