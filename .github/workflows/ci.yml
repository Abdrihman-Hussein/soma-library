name: CI

on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Frontend typecheck and build
      run: |
        cd frontend
        npm ci
        npm run typecheck
        npm run build

    - name: Backend typecheck
      run: |
        cd backend
        npm ci
        npm run typecheck